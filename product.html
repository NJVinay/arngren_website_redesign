<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Details - Arngren</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="assets/styles.css" rel="stylesheet">
</head>
<body>
  <div id="site-header"></div>

  <main class="container mx-auto">
    <nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb"></nav>

    <article id="product" class="panel product-detail">
      <div class="media">
        <img id="product-image" src="" alt="">
      </div>
      <div class="details">
        <p id="product-category" class="eyebrow"></p>
        <h1 id="product-name">Loading...</h1>
        <p id="product-description" class="text-lg"></p>

        <h2>Key Features</h2>
        <ul id="product-features"></ul>

        <h2>Why Buy This Product?</h2>
        <p id="product-usage"></p>

        <div class="buy-row">
          <span id="product-price" class="price text-3xl"></span>
          <div class="qty">
            <button type="button" data-step="-1" aria-label="Decrease quantity">−</button>
            <input id="qty-input" type="number" value="1" min="1" max="99" aria-label="Quantity">
            <button type="button" data-step="1" aria-label="Increase quantity">+</button>
          </div>
          <button id="buy-button" type="button" class="btn-primary">Add to cart</button>
        </div>
      </div>
    </article>

    <section id="related" class="section" hidden>
      <h2 class="section-title">You might also like</h2>
      <div id="related-grid" class="product-grid"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="products.js"></script>
  <script src="assets/site.js"></script>
  <script src="product.js"></script>
</body>
</html>
